<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>좀비 서바이벌: 협동 작전</title>
<meta property="og:title" content="좀비 서바이벌: 협동 작전">
<meta property="og:description" content="최대 6인 온라인 협동 좀비 보드게임 — 링크를 눌러 바로 참가!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#121417;--panel:#1c2026;--panel2:#252a32;--line:#343a44;--txt:#eef1f5;--dim:#9aa3af;--acc:#f43f5e;--good:#22c55e;--warn:#f59e0b;--blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;border-radius:10px;background:var(--panel2);padding:10px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--acc);color:#fff;font-weight:700}
button.ok{background:var(--good);color:#06240f;font-weight:700}
button.sm{padding:6px 9px;font-size:13px;border-radius:8px}
input{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.screen{max-width:760px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.logo{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:40px;line-height:1.05;letter-spacing:.5px;color:#fff;text-shadow:0 3px 0 #7f1d1d}
.logo small{display:block;font-size:17px;color:var(--acc);text-shadow:none;margin-top:6px;font-family:'Noto Sans KR'}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.dim{color:var(--dim);font-size:13px}
h3{margin:0 0 8px;font-size:16px}
.code{font-family:monospace;font-size:30px;letter-spacing:6px;font-weight:700;color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.plist .p{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scard{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:10px;text-align:left;position:relative}
.scard.mine{border-color:var(--good)}
.scard.taken{opacity:.7}
.scard .nm{font-weight:700;font-size:16px}
.scard .owner{position:absolute;right:8px;top:8px;font-size:11px;padding:2px 6px;border-radius:6px;background:#0006}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#0005;margin-right:4px}
.mgrid{display:grid;gap:8px}
.mcard{text-align:left;background:var(--panel2);border:2px solid transparent}
.mcard.on{border-color:var(--acc)}
/* 게임 화면 */
#game{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.pill{padding:3px 8px;border-radius:999px;font-weight:700;font-size:12px;color:#111}
.boardwrap{flex:0 1 auto;max-height:60dvh;overflow:auto;position:relative;background:#0b0c0e;touch-action:pan-x pan-y}
.boardwrap svg{display:block;margin:0 auto}
.zoom{position:sticky;float:right;margin:-92px 8px 8px 0;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;padding:0;background:#000a;font-size:20px}
.bottom{flex:1 1 auto;min-height:38dvh;background:var(--panel);border-top:1px solid var(--line);overflow:auto;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.team{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;background:var(--panel2);border-radius:10px;padding:5px 8px;font-size:12px;border:2px solid transparent;text-align:left}
.chip.act{border-color:#fff}
.chip.done{opacity:.5}
.chip b{font-size:13px}
.hp{letter-spacing:-1px}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:6px 0}
.slot{background:var(--panel2);border:2px dashed var(--line);border-radius:9px;min-height:64px;padding:5px;font-size:11px;text-align:left;position:relative;line-height:1.25}
.slot.hand{border-style:solid;border-color:#4b5563}
.slot.sel{border-color:#facc15;background:#3b3415}
.slot .cn{font-weight:700;font-size:12px;display:block;margin-bottom:2px}
.slot .lb{position:absolute;bottom:2px;right:4px;font-size:9px;color:var(--dim)}
.slot.epic .cn{color:#fbbf24}
.slot.unl{opacity:.6}
.pend{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.pend .slot{min-width:110px;border-color:#22c55e;border-style:solid;background:#12301d}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts button{padding:9px 4px;font-size:13px;line-height:1.15}
.acts button.on{outline:2px solid #facc15}
.hint{font-size:12px;color:#fde68a;margin:4px 0}
.log{font-size:12px;max-height:40dvh;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid #ffffff0d}
.log .good{color:#86efac}.log .bad{color:#fca5a5}.log .z{color:#fdba74}.log .sys{color:#93c5fd}.log .hurt{color:#f9a8d4}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.dice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.die{width:48px;height:48px;border-radius:10px;background:#f8fafc;color:#111;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #9ca3af}
.die.hit{background:#22c55e;color:#fff;box-shadow:0 3px 0 #15803d}
.die.roll{animation:spin .5s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#111827;border:1px solid #374151;padding:10px 14px;border-radius:12px;z-index:60;max-width:90%;font-size:14px;box-shadow:0 8px 24px #000a}
.toast.err{border-color:#ef4444}
.status{font-size:12px;padding:3px 8px;border-radius:8px;background:#0006}
.skillopt{display:block;width:100%;text-align:left;margin:6px 0}
.cellinfo{position:absolute;left:8px;bottom:8px;background:#000c;border-radius:10px;padding:8px 10px;font-size:12px;z-index:3;max-width:70%}
.turnbar{font-size:13px;margin-bottom:6px}
.bar{height:6px;background:#0006;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
a{color:#93c5fd}
.rollpop{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));display:flex;justify-content:center;z-index:40;pointer-events:none}
.rollpop .box{background:#111827ee;border:1px solid #374151;border-radius:14px;padding:8px 14px;font-size:13px}
.rollpop .die{width:34px;height:34px;font-size:19px}
.rollpop .dice{margin:6px 0}
/* ---- 그래픽 개편 ---- */
body{background:#0d0e10 radial-gradient(ellipse at top,#2a1414 0,#0d0e10 60%) fixed}
.titlebg{position:fixed;inset:0;background-size:cover;background-position:center 15%;opacity:.55;filter:saturate(.75) contrast(1.1);z-index:0;pointer-events:none}
.titlebg+.screen{position:relative;z-index:1}
.titlebg::after{content:'';position:absolute;inset:0;background:linear-gradient(#0d0e1033 0,#0d0e1099 45%,#0d0e10 90%)}
.logo{font-size:46px;text-shadow:0 3px 0 #7f1d1d,0 0 24px #dc262688}
.card{background:#16181ccc;backdrop-filter:blur(4px);border-color:#3a2a2a}
button.pri{background:linear-gradient(#e11d48,#9f1239);box-shadow:0 3px 0 #4c0519;text-shadow:0 1px 0 #0006}
.scard{min-height:150px;padding-right:82px;cursor:pointer;overflow:hidden}
.scard .port{position:absolute;right:0;top:0;width:78px;height:100%;object-fit:cover;object-position:center 15%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.scard.aip{border-color:#94a3b8;background:#1e2633}
.scard .owner{right:auto;left:auto;position:static;display:inline-block;margin-bottom:3px}
.aibtn{position:absolute;right:6px;bottom:6px;z-index:2;padding:4px 8px;font-size:12px;border-radius:8px;background:#000b;border:1px solid #64748b}
.aibtn.on{background:#334155;border-color:#e2e8f0;font-weight:800}
.boardwrap{max-height:64dvh;background:#070707}
.top{background:linear-gradient(#1f1414,#16181c)}
.chip{display:flex;flex-direction:column;position:relative;padding-left:40px;min-height:44px;justify-content:center}
.chip .hd{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #0008}
.slot{min-height:92px;padding:4px;background:#1a1d22;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.slot.hand{background:linear-gradient(#2a1f12,#1a1d22);border-color:#a16207}
.slot.epic{background:linear-gradient(#3b2a06,#1a1d22);border-color:#f59e0b;box-shadow:0 0 10px #f59e0b55 inset}
.slot .wi{height:30px;max-width:100%;image-rendering:pixelated;object-fit:contain;margin:2px 0;filter:drop-shadow(0 2px 0 #000)}
.slot .wi.em{font-size:22px;line-height:30px;height:30px}
.slot .cn{font-size:11px;margin:0}
.slot .cs{font-size:9.5px;color:#cbd5e1;line-height:1.2}
.pend .slot{min-width:96px;min-height:92px}
.acts button{background:linear-gradient(#2b3038,#20242b);box-shadow:0 2px 0 #0008}
.die{background:#f5efe0;box-shadow:0 3px 0 #a8a29e}
/* ---- 레이아웃 v3: 지도 한눈에 ---- */
#game{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{flex:0 0 auto;height:46px;gap:5px;padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top))}
.top .rnd{font-size:15px}.top .who{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top .net{font-size:12px}
.ib{width:34px;height:34px;padding:0;font-size:16px;border-radius:9px;background:#0005}
.ib s{opacity:.45}
.main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#game.land .main{flex-direction:row}
.boardwrap{flex:0 0 auto;max-height:none;overflow:auto;position:relative;display:flex;align-items:center;justify-content:center}
#game.land .boardwrap{width:60%;height:auto!important}
.boardwrap svg{margin:auto;flex:0 0 auto}
.zoom{position:absolute;right:6px;bottom:6px;margin:0;float:none}
.zoom button{width:34px;height:34px;font-size:18px;background:#000b;border:1px solid #fff2}
.bottom{flex:1 1 auto;min-height:0;overflow:auto;padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.team{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.chip{flex:0 0 auto;display:grid;grid-template-columns:30px auto;grid-template-rows:auto auto;column-gap:5px;align-items:center;padding:3px 7px 3px 3px;border-radius:20px;border:2px solid transparent;background:#20242b;min-height:0;position:relative;font-size:11px;text-align:left}
.chip .hd{grid-row:1/3;width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--c);position:static;transform:none}
.chip .nm{font-weight:700;font-size:11px;line-height:1.1}
.chip .hp{font-size:9px;line-height:1}
.chip .ap{grid-column:2;font-size:9px;font-weight:800;display:none}
.chip .st{position:absolute;left:0;top:-3px;font-style:normal;font-size:11px}
.chip.act{border-color:#fff;background:#2b3240}
.chip.done{opacity:.45}
.ticker{font-size:12px;padding:4px 8px;margin:4px 0;background:#0006;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ticker div{border:0;padding:0}
.wait{font-size:14px;font-weight:700;margin:6px 0;color:#cbd5e1}
.wait.mineturn{color:#fde68a}
.mine{display:flex;align-items:center;gap:6px;margin-top:6px}
.mine .hd{width:24px;height:24px;border-radius:50%;object-fit:cover}
.pickrow{display:flex;gap:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:30px;border:2px solid var(--c);background:#20242b}
.pick img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.actor{display:flex;align-items:center;gap:8px;background:#0005;border-radius:12px;padding:5px 8px;margin-bottom:5px}
.actor .hd{width:40px;height:40px;border-radius:50%;object-fit:cover;border:3px solid}
.actor .bar{height:5px;margin-top:4px}
.tag.free{background:#14532d}
.dots{text-align:center;font-size:10px;color:var(--dim)}
.dots div{display:flex;gap:3px;margin-top:2px}
.dots i{width:13px;height:13px;border-radius:50%;background:#374151;display:block}
.dots i.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
.inv{gap:4px;margin:4px 0}
.slot{min-height:64px;padding:3px 2px;border-radius:8px}
.slot .wi{height:24px}
.slot .wi.em{font-size:18px;line-height:24px;height:24px}
.slot .cn{font-size:10.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .cs{font-size:9px;line-height:1.15}
.slot .em0{font-size:20px;opacity:.25;margin:auto}
.slot .lb{display:none}
.selrow{font-size:12px;margin:2px 0 4px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;min-height:52px;font-size:10.5px;line-height:1.1;border-radius:10px}
.acts button i{font-style:normal;font-size:19px;line-height:22px;height:22px;display:flex;align-items:center}
.acts button i img{height:20px;max-width:44px;image-rendering:pixelated}
.acts button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.acts button.on{outline:2px solid #facc15;background:#3b3415}
.acts button.atk:not(:disabled){background:linear-gradient(#4a1d1d,#2a1414)}
.acts button.hot:not(:disabled){background:linear-gradient(#14532d,#0f2e1c);outline:1px solid #4ade80}
.acts button.end{background:#334155}
.acts button.end.pri{background:linear-gradient(#e11d48,#9f1239)}
.log.full{max-height:none}
.cellinfo{left:6px;bottom:6px}
@media (min-width:640px){.acts{grid-template-columns:repeat(6,1fr)}}
.coach{font-size:12.5px;line-height:1.35;background:linear-gradient(90deg,#1e3a5f,#172033);border-left:3px solid #60a5fa;border-radius:8px;padding:6px 9px;margin:4px 0 5px;color:#dbeafe}
.brief ol{padding-left:18px;font-size:13.5px;line-height:1.5;margin:8px 0}
.brief ol li{margin-bottom:4px}
.brief .goal{background:#3b0d0d;border:1px solid #7f1d1d;border-radius:10px;padding:8px 10px;font-size:13.5px}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:70;font-family:'Black Han Sans','Noto Sans KR';font-size:38px;padding:14px 28px;border-radius:16px;pointer-events:none;white-space:nowrap;animation:bn 1.8s ease-out forwards;text-shadow:0 3px 0 #000}
.banner.m{background:#1d4ed8e6;color:#fff}.banner.z{background:#7f1d1de6;color:#fff}.banner.w{background:#15803de6;color:#fff}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
</style>

const mapCache = {};
function getMap(mid) {
  if (mapCache[mid]) return mapCache[mid];
  const M = MISSIONS[mid];
  const H = M.grid.length, W = M.grid[0].length;
  const cells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = M.grid[y][x];
    const c = { i: y * W + x, x, y, ch };
    if (ch === '.') c.type = 'street';
    else if (ch === '#') c.type = 'void';
    else { c.type = 'building'; c.b = ch.toUpperCase(); c.dark = ch !== ch.toUpperCase(); }
    cells.push(c);
  }
  const idx = (x, y) => y * W + x;
  const doors = M.doors.map((d, k) => ({ k, a: idx(d[0][0], d[0][1]), b: idx(d[1][0], d[1][1]), color: d[2] || null }));
  const doorByEdge = {};
  doors.forEach(d => doorByEdge[ek(d.a, d.b)] = d.k);
  const walls = {};
  (M.walls || []).forEach(w => walls[ek(idx(w[0][0], w[0][1]), idx(w[1][0], w[1][1]))] = true);
  const buildings = {};
  cells.forEach(c => { if (c.type === 'building') (buildings[c.b] = buildings[c.b] || []).push(c.i); });
  const map = {
    W, H, cells, doors, doorByEdge, walls, buildings, idx,
    objectives: M.objectives.map(o => ({ cell: idx(o.x, o.y), c: o.c })),
    epics: M.epics.map(o => idx(o.x, o.y)),
    spawns: M.spawns.map(s => ({ cell: idx(s.x, s.y), start: !!s.start, c: s.c || null })),
    start: idx(M.start.x, M.start.y), exit: idx(M.exit.x, M.exit.y),
  };
  mapCache[mid] = map;
  return map;
}
function ek(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
function neighbors(map, i) {
  const c = map.cells[i], r = [];
  if (c.x > 0) r.push(i - 1); if (c.x < map.W - 1) r.push(i + 1);
  if (c.y > 0) r.push(i - map.W); if (c.y < map.H - 1) r.push(i + map.W);
  return r;
}
// 두 인접 구역 사이가 열려 있는가
function edgeOpen(st, map, a, b) {
  const A = map.cells[a], B = map.cells[b];
  if (A.type === 'void' || B.type === 'void') return false;
  const k = ek(a, b);
  const dk = map.doorByEdge[k];
  if (dk !== undefined) return !!st.doors[dk];
  if (A.type === 'street' && B.type === 'street') return true;
  if (A.type === 'building' && B.type === 'building') return A.b === B.b && !map.walls[k];
  return false;
}
// 시야: {구역: 거리}
function visible(st, map, from) {
  const res = {}; res[from] = 0;
  const fc = map.cells[from];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dx, dy] of dirs) {
    let cur = from, d = 0, inB = fc.type === 'building';
    let first = true;
    while (true) {
      const c = map.cells[cur];
      const nx = c.x + dx, ny = c.y + dy;
      if (nx < 0 || ny < 0 || nx >= map.W || ny >= map.H) break;
      const nxt = map.idx(nx, ny);
      if (!edgeOpen(st, map, cur, nxt)) break;
      d++;
      res[nxt] = Math.min(res[nxt] === undefined ? 99 : res[nxt], d);
      const n = map.cells[nxt];
      if (n.type === 'building') break;          // 건물 안으로는 1구역까지만
      if (first && inB && n.type !== 'street') break;
      first = false;
      cur = nxt;
    }
  }
  return res;
}
// BFS 거리 (열린 경로)
function bfs(st, map, src) {
  const dist = new Array(map.cells.length).fill(Infinity);
  dist[src] = 0; const q = [src];
  while (q.length) {
    const c = q.shift();
    for (const n of neighbors(map, c)) if (dist[n] === Infinity && edgeOpen(st, map, c, n)) { dist[n] = dist[c] + 1; q.push(n); }
  }
  return dist;
}

    if (vert) {

    } else {
      const x = A.x * CS + 26;
      o += wall(A.x * CS, my, x, my) + wall(x + 44, my, (A.x + 1) * CS, my);
      o += open ? `<path d="M${x} ${my} l6 14" stroke="${col}" stroke-width="5" stroke-linecap="round"/><path d="M${x + 44} ${my} l-6 14" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`
        : `<rect x="${x}" y="${my - 6}" width="44" height="12" rx="2" fill="${col}" stroke="#1a1209" stroke-width="2" filter="url(#ds)"/><line x1="${x + 4}" y1="${my}" x2="${x + 40}" y2="${my}" stroke="#0004" stroke-width="2"/>${d.color ? `<text x="${x + 22}" y="${my + 5}" font-size="13" text-anchor="middle">🔒</text>` : ''}`;
    }

  map.spawns.forEach((sp, i) => {

    const active = S.spawnActive[i] === true;

  }

    o += `<g filter="url(#ds)"><rect x="${x - 13}" y="${y - 13}" width="26" height="26" rx="4" fill="#f5f0e6" stroke="${col}" stroke-width="3" transform="rotate(8 ${x} ${y})"/><path d="M${x - 7} ${y - 7}L${x + 7} ${y + 7}M${x + 7} ${y - 7}L${x - 7} ${y + 7}" stroke="${col}" stroke-width="5" stroke-linecap="round"/></g>`;

  });

  const ORD = { 'A': 0, B: 1, R: 2, W: 3 };

  for (const k in sc) {
    const c = map.cells[k]; const arr = sc[k];
    const per = Math.min(4, arr.length);
    arr.forEach((x, i) => {
      const def = ZE.SURV[x.id];

      o += EMB['head_' + x.id] ? `<image href="${EMB['head_' + x.id]}" x="${cx - 13}" y="${cy - 13}" width="26" height="26" clip-path="url(#cp${x.id})" preserveAspectRatio="xMidYMid slice"/>` : `<circle cx="${cx}" cy="${cy}" r="13" fill="${def.color}"/>`;
      o += `<circle cx="${cx}" cy="${cy}" r="13.5" fill="none" stroke="${def.color}" stroke-width="3"/>`;
      if (x.wounds) o += `<circle cx="${cx + 10}" cy="${cy - 10}" r="6" fill="#dc2626" stroke="#fff" stroke-width="1"/><text x="${cx + 10}" y="${cy - 7}" font-size="8" text-anchor="middle" fill="#fff" font-weight="900">${x.wounds}</text>`;

  }

  map.cells.forEach(c => {
    const h = hl[c.i];
    if (h) o += `<rect x="${c.x * CS + 4}" y="${c.y * CS + 4}" width="${CS - 8}" height="${CS - 8}" rx="8" fill="${h.c}26" stroke="${h.c}" stroke-width="3.5"><animate attributeName="stroke-opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/></rect>${h.t ? `<text x="${c.x * CS + 90}" y="${c.y * CS + 20}" font-size="12" text-anchor="end" fill="${h.c}" font-weight="900" stroke="#000" stroke-width="3" paint-order="stroke">${h.t}</text>` : ''}`;
    if (ui.cell === c.i) o += `<rect x="${c.x * CS + 2}" y="${c.y * CS + 2}" width="${CS - 4}" height="${CS - 4}" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4"/>`;
    o += `<rect x="${c.x * CS}" y="${c.y * CS}" width="${CS}" height="${CS}" fill="transparent" data-a="cell" data-c="${c.i}" data-h="${h ? 1 : 0}"/>`;
  });

  return o;
}

    h += ticker + `<div class="wait mineturn">🔔 내 차례! 행동할 생존자를 고르세요</div><div class="coach">한 생존자의 행동(3번)을 끝내고 [턴 종료]를 누른 뒤 다음 생존자를 골라요.</div><div class="pickrow">${mine.map(x => `<button class="pick" data-a="select" data-sid="${x.id}" style="--c:${ZE.SURV[x.id].color}"><img src="${EMBED_('head_' + x.id)}"><b>${ZE.SURV[x.id].n}</b><span>${hearts(x)}</span></button>`).join('')}</div>`;
    return h;
  }
  const def = ZE.SURV[s.id];
  const left = ZE.actionsLeft(s), max = ZE.maxActions(s);
  const cpo = ZE.curPlayer(S);
  if (cpo !== me.pid && isHost()) h += `<div class="hint">📴 ${esc(pl(cpo).name)}님 오프라인 — 방장이 대신 조작 <button class="sm" data-a="aitake" data-pid="${esc(cpo)}">${aiFor[cpo] ? '직접 하기' : '🤖 AI에게 맡기기'}</button></div>`;
  const fp = ZE.freePool(s); const freeTxt = Object.keys(fp).filter(k => fp[k] - (s.freeUsed[k] || 0) > 0).map(k => ({ move: '이동', melee: '근접', ranged: '원거리', combat: '전투', search: '수색', door: '문' }[k])).join('·');
  const lv = ZE.levelOf(s.ap), next = ZE.LEVELS[lv + 1];
  let dots = ''; for (let i = 0; i < Math.max(max, left); i++) dots += `<i class="${i < left ? 'on' : ''}"></i>`;
  h += `<div class="actor" data-a="detail" data-sid="${s.id}">
    <img class="hd" src="${EMBED_('head_' + s.id)}" style="border-color:${def.color}">
    <div class="grow"><b style="color:${def.color}">${def.n}</b> <span class="hp">${hearts(s)}</span>${freeTxt ? ` <span class="tag free">무료 ${freeTxt}</span>` : ''}
      <div class="bar"><i style="width:${next ? Math.min(100, (s.ap - ZE.LEVELS[lv].ap) / (next.ap - ZE.LEVELS[lv].ap) * 100) : 100}%;background:${lvlColor(s.ap)}"></i></div></div>
    <div class="dots"><span>행동</span><div>${dots}</div></div></div>`;
  h += `<div class="coach">${coach(s)}</div>`;
  h += invHTML(s, true);
  if (s.pending.length || s.pendSkill.length) return h;
  const map = ZE.getMap(S.mission);
  const zHere = ZE.zomAt(S, s.cell).length;
  const btn = (a, ic, label, en, extra, cls) => `<button data-a="${a}" ${extra || ''} ${en ? '' : 'disabled'} class="${cls || ''}"><i>${ic}</i><span>${label}</span></button>`;
  let b = '';
  b += btn('mode', '🚶', `이동${zHere && !ZE.hasSkill(s, 'slippery') ? ` +${zHere}` : ''}`, true, 'data-m="move"', ui.mode === 'move' ? 'on' : '');
  [0, 1].forEach(sl => {
    const w = ZE.weaponInfo(S, s, sl);
    if (!w) return;
    const ok = !ZE.hoboBlock(S, s) && (w.melee ? zHere > 0 : (w.loaded && ZE.rangedTargets(S, s, w).some(c => w.d.molotov || ZE.zomAt(S, c).length))) && ZE.canSpend(s, w.melee ? 'melee' : 'ranged');
    const icon = EMBED_('w_' + w.c.k) ? `<img src="${EMBED_('w_' + w.c.k)}">` : (w.d.molotov ? '🔥' : w.melee ? '🗡️' : '🔫');
    b += btn('atk', icon, `${w.d.n}${w.dual ? '×2' : ''}`, ok, `data-s="${sl}"`, 'atk' + (ui.mode === 'attack' && ui.wslot === sl ? ' on' : ''));
    if (w.d.reload && !w.loaded) b += btn('op', '🔄', '재장전', ZE.canSpend(s, 'other'), `data-op="reload" data-s="${sl}"`);
  });
  const se = ZE.canSearch(S, s);
  if (map.cells[s.cell].type === 'building') b += btn('op', '🔍', '수색', !se, 'data-op="search"');
  ZE.adjDoors(S, s).forEach(d => {
    const other = d.a === s.cell ? d.b : d.a; const A = map.cells[s.cell], B = map.cells[other];
    const dir = B.x > A.x ? '→' : B.x < A.x ? '←' : B.y > A.y ? '↓' : '↑';
    const locked = ZE.doorLocked(S, d);
    b += btn('door', '🚪', `문${dir}${locked ? '🔒' : !ZE.doorTool(s) ? '(도구)' : ''}`, !locked && ZE.doorTool(s) && ZE.canSpend(s, 'door'), `data-k="${d.k}"`);
  });
  if (S.objectives.some(o => o.cell === s.cell && !o.taken)) b += btn('op', '🎯', '목표 획득', ZE.canSpend(s, 'other'), 'data-op="objective"', 'hot');
  if (S.epics.some(e => e.cell === s.cell && !e.taken)) b += btn('op', '🎁', '무기 상자', ZE.canSpend(s, 'other'), 'data-op="epic"', 'hot');
  if (ZE.chargeTargets(S, s).length) b += btn('mode', '💨', '돌격', true, 'data-m="charge"', ui.mode === 'charge' ? 'on' : '');
  ZE.survAt(S, s.cell).filter(x => x !== s).forEach(x => { b += btn('trade', '🤝', `${ZE.SURV[x.id].n} 교환`, ZE.canSpend(s, 'other'), `data-w="${x.id}"`); });
  b += btn('op', '🎒', s.reorg ? '정리 중' : '정리', ZE.canSpend(s, 'other') && !s.reorg, 'data-op="reorg"');
  b += btn('op', '📢', '소음', ZE.canSpend(s, 'other'), 'data-op="noise"');
  const canEsc = s.cell === map.exit && !zHere && ZE.objectivesDone(S);
  b += btn('end', canEsc ? '🏃' : '⏭', canEsc ? '탈출·종료' : '턴 종료', true, '', 'end' + (left <= 0 && !ZE.hasFreeLeft(s) ? ' pri' : ''));
  h += `<div class="acts">${b}</div>`;
  h += ui.mode === 'attack' && ui.wslot != null ? `<div class="hint">🎯 지도에서 빨간 칸을 탭해 공격</div>` : ui.mode === 'charge' ? `<div class="hint">💨 주황 칸을 탭해 돌격</div>` : '';
  h += ticker;
  return h;
}

/* ---------- 도우미: 지금 뭘 하면 좋을지 ---------- */
function coach(s) {
  const map = ZE.getMap(S.mission);
  const left = ZE.actionsLeft(s), zh = ZE.zomAt(S, s.cell).length;
  if (s.pending.length) return '🆕 새 카드를 손(✋) 또는 가방(🎒) 칸에 넣으세요. 무기는 손에 들어야 쓸 수 있어요.';
  if (left <= 0 && !ZE.hasFreeLeft(s)) return '✅ 행동을 다 썼어요 → [턴 종료]를 누르세요.';
  if (s.cell === map.exit && !zh && ZE.objectivesDone(S)) return '🏃 출구에 도착! [탈출·종료]로 빠져나가세요. 모두 탈출하면 승리!';
  const mel = [0, 1].map(i => ZE.weaponInfo(S, s, i)).find(w => w && w.melee);
  if (zh) return mel ? `🧟 같은 칸에 좀비 ${zh}마리! [${mel.d.n}]로 공격하세요. 여기서 나가려면 행동 +${zh}가 더 들어요.` : `🧟 같은 칸에 좀비 ${zh}마리! 근접 무기가 없으면 빨리 피하세요 (나갈 때 행동 +${zh}).`;
  const rg = [0, 1].map(i => ZE.weaponInfo(S, s, i)).find(w => w && !w.melee && w.loaded && ZE.rangedTargets(S, s, w).some(c => ZE.zomAt(S, c).length));
  if (rg) return `🎯 [${rg.d.n}] 사거리 안에 좀비가 있어요. 무기 버튼 → 빨간 칸 탭으로 사격 (빗나가면 그 칸 아군이 맞아요!)`;
  if (S.objectives.some(o => o.cell === s.cell && !o.taken)) return '🎯 이 칸에 목표(✕)가 있어요! [목표 획득] (+5 AP)';
  if (S.epics.some(e => e.cell === s.cell && !e.taken)) return '🎁 무기 상자가 있어요! [무기 상자]로 강력한 무기 획득';
  if (map.cells[s.cell].type === 'building' && !ZE.canSearch(S, s)) return '🔍 건물 안이에요. [수색]으로 무기·장비를 찾아보세요 (턴에 1번).';
  const d = ZE.adjDoors(S, s).find(d => !ZE.doorLocked(S, d));
  if (d && ZE.doorTool(s)) return '🚪 옆에 닫힌 문이 있어요. 열면 안쪽 어두운 방에 좀비가 생겨요 — 준비하고 여세요!';
  if (d) return '🚪 문을 열려면 도끼·쇠지렛대 같은 도구를 손에 들어야 해요.';
  if (ZE.objectivesDone(S)) return '✅ 목표 완료! 초록 EXIT 출구로 모두 이동하세요.';
  return '🚶 [이동]이 켜져 있어요. 초록 칸을 탭해 빨간 ✕ 목표나 ★ 상자 쪽으로 가세요.';
}

        ${R.re.ammo ? '<button data-a="reroll" data-src="ammo">🎯 탄약: 다시 굴리기</button>' : ''}

    </div></div>`;
  } else if (rollAnim && S.lastRoll) {

    m += `<div class="rollpop"><div class="box" style="text-align:center">
      <b>${esc(ZE.SURV[L.sid].n)} · ${esc(L.w)}</b>
      <div class="dice">${L.vals.map(v => `<div class="die roll ${v >= L.acc ? 'hit' : ''}">${v}</div>`).join('')}</div>
      <div>명중 <b>${L.hits}</b> · 처치 <b>${L.kills}</b></div></div></div>`;
  }
  // 스킬 선택
  const ps = S.survivors && S.survivors.find(s => s.pendSkill.length && (s.owner === me.pid || (isHost() && !pl(s.owner).on)));
  if (ps && !S.roll) {
    const o = ps.pendSkill[0];
    m += `<div class="modal"><div class="box"><h3>⬆️ ${ZE.SURV[ps.id].n} — ${ZE.LEVELS[o.lvl].name} 레벨 스킬 선택</h3>
      ${o.opts.map((k, i) => `<button class="skillopt" data-a="skill" data-sid="${ps.id}" data-i="${i}"><b>${ZE.SKILLS[k].n}</b><br><span class="dim">${ZE.SKILLS[k].d}</span></button>`).join('')}</div></div>`;
  }
  // 교환
  if (S.trade && canControl()) {
    const A = S.survivors.find(s => s.id === S.trade.a), B = S.survivors.find(s => s.id === S.trade.b);
    m += `<div class="modal"><div class="box"><h3>🤝 교환 — 카드를 탭하고 옮길 칸을 탭하세요</h3>
      <b style="color:${ZE.SURV[A.id].color}">${ZE.SURV[A.id].n}</b>${invHTML(A, true)}
      <b style="color:${ZE.SURV[B.id].color}">${ZE.SURV[B.id].n}</b>${invHTML(B, true)}
      <button class="ok" style="width:100%;margin-top:8px" data-a="trade_done">교환 완료</button></div></div>`;
  }
  // 생존자 상세
  if (ui.detail) {
    const s = S.survivors.find(x => x.id === ui.detail);
    if (s) {
      const def = ZE.SURV[s.id];
      const can = canControl() && s.owner === ZE.curPlayer(S) && !s.done && !s.dead && !s.escaped && S.active !== s.id;
      m += `<div class="modal" data-a="closedetail"><div class="box" data-stop="1">
        <div class="row"><h3 class="grow" style="color:${def.color}">${def.n} <span class="dim">${def.role}${def.kid ? ' · 어린이' : ''}</span></h3><button class="sm" data-a="closedetail">닫기</button></div>
        <div>${s.dead ? '💀 사망' : s.escaped ? '🚪 탈출' : hearts(s)} · AP ${s.ap} (${ZE.LEVELS[ZE.levelOf(s.ap)].name}) · 플레이어 ${esc(pl(s.owner).name)}</div>

        <div class="dim">남은 레벨업 선택지: 🟠 ${def.orange.map(k => ZE.SKILLS[k].n).join(' / ')} · 🔴 ${def.red.map(k => ZE.SKILLS[k].n).join(' / ')}</div>
        ${invHTML(s, false)}
        ${can ? `<button class="pri" style="width:100%" data-a="select" data-sid="${s.id}">이 생존자로 행동</button>` : ''}

  }
  if (ui.help) m += helpModal();
  if (S.phase !== 'over' && store('zsv-brief') !== briefKey()) m += briefModal();
  if (banner) m += `<div class="banner ${banner.c}">${banner.t}</div>`;
  return m;
}

  <b>지도 보기</b>: ✕=목표, ★상자=에픽 무기, ☠=스폰, 빗금(어두운 바닥)=어두운 방, 갈색 막대=닫힌 문, 벌어진 선=열린 문.<br><br>
  <b>🤖 AI 동료</b>: 대기실에서 방장이 생존자 카드의 AI 버튼을 누르면 AI가 맡아요. 게임 중 누가 나가면 방장 화면의 'AI에게 맡기기'로 대신 진행할 수 있어요.<br><br>
  <span class="dim">그래픽·사운드: Kenney(CC0) 도시 타일·카지노 사운드, CraftPix 무료 좀비 스프라이트, LO BIT CITY(Greywyrd), 무료 픽셀 무기 팩, 포스트 아포칼립스 초상화 팩, Snake's Authentic Gun Sounds 외 무료 효과음 팩. 원작 보드게임의 이름·그림은 사용하지 않은 팬 제작 버전이에요.</span>
  </div></div></div>`;
}

/* ---------- 입력 ---------- */
function act(op, a) { Net.act(op, a); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const A = t.dataset.a, D = t.dataset;
  if (A !== 'cell') SND.play('click', .18);
  if (t.closest('[data-stop]') && (A === 'closedetail') && t.classList.contains('modal')) return;
  switch (A) {
    case 'create': { const n = getName(); if (!n) return; const code = newCode(); store('zsv-host', null); Net.hostRoom(code, me.pid, n); wakeLock(); break; }
    case 'resume': { const sv = store('zsv-host'); const n = getName(); if (!n || !sv) return; Net.hostRoom(sv.code, me.pid, n, sv.state); wakeLock(); break; }
    case 'join': { const n = getName(); if (!n) return; Net.joinRoom(roomParam, me.pid, n); netStatus = 'connecting'; renderHome(); wakeLock(); break; }
    case 'join-code': { const n = getName(); if (!n) return; const c = ($('#rc').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.length < 4) return toast('방 코드를 확인해주세요', true); history.replaceState(null, '', '?room=' + c + (params.get('ps') ? '&ps=' + params.get('ps') : '')); Net.joinRoom(c, me.pid, n); netStatus = 'connecting'; renderHome(); break; }
    case 'home-clear': location.href = location.pathname + (params.get('ps') ? '?ps=' + params.get('ps') : ''); break;
    case 'share': share(); break;
    case 'copy': copy(inviteUrl()); break;
    case 'pick': act('pick', { sid: D.sid }); break;
    case 'pickai': e.stopPropagation(); act('pickai', { sid: D.sid }); break;
    case 'mute': SND.toggle(); render(); break;
    case 'aitake': aiFor[D.pid] = !aiFor[D.pid]; toast(aiFor[D.pid] ? '🤖 AI가 대신 플레이해요' : 'AI 대신하기 해제'); render(); aiTick(); break;
    case 'mission': act('mission', { m: D.m }); break;
    case 'diff': act('diff', { d: D.d }); break;
    case 'kick': act('kick', { pid: D.pid }); break;
    case 'start': act('start'); break;
    case 'restart': act('restart'); break;
    case 'zoom': ui.zoom = D.z === '0' ? 1 : Math.max(1, Math.min(4, ui.zoom * (D.z === '1' ? 1.3 : 1 / 1.3))); render(); { const a = activeS(); if (a && ui.zoom > 1) centerOn(a.cell); } break;
    case 'music': BGM.toggle(); render(); break;
    case 'brief': store('zsv-brief', briefKey()); BGM.start(); render(); break;
    case 'view': ui.view = D.v; render(); break;
    case 'help': ui.help = !ui.help; render(); break;
    case 'cellclose': ui.cell = null; render(); break;
    case 'detail': ui.detail = D.sid; render(); break;
    case 'closedetail': if (e.target === t || t.tagName === 'BUTTON') { ui.detail = null; render(); } break;
    case 'closeroll': rollAnim = false; render(); break;
    case 'select': ui.detail = null; ui.mode = 'move'; ui.sel = null; act('select', { sid: D.sid }); break;
    case 'mode': ui.mode = D.m; ui.wslot = null; render(); break;
    case 'atk': {
      const s = activeS(); const sl = +D.s; const w = ZE.weaponInfo(S, s, sl);
      if (w.melee) { act('attack', { slot: sl }); ui.mode = 'move'; }
      else { ui.mode = 'attack'; ui.wslot = sl; render(); }
      break;
    }
    case 'cell': {
      const c = +D.c;
      if (D.h === '1') {
        if (ui.mode === 'move') act('move', { cell: c });
        else if (ui.mode === 'charge') { act('charge', { cell: c }); ui.mode = 'move'; }
        else if (ui.mode === 'attack') {
          const s = activeS(); const w = ZE.weaponInfo(S, s, ui.wslot);
          if (w && w.d.molotov && ZE.survAt(S, c).filter(x => x !== s).length && !confirmBox('화염병은 그 구역의 아군도 죽여요(=즉시 패배). 그래도 던질까요?')) return;
          act('attack', { slot: ui.wslot, cell: c }); ui.mode = 'move'; ui.wslot = null;
        }
        ui.cell = null;
      } else { ui.cell = ui.cell === c ? null : c; render(); }
      break;
    }
    case 'op': act(D.op, D.s != null ? { slot: +D.s } : {}); ui.mode = 'move'; break;
    case 'door': act('door', { k: +D.k }); break;
    case 'trade': act('trade', { with: D.w }); break;
    case 'trade_done': ui.sel = null; act('trade_done'); break;
    case 'end': {
      const s = activeS();
      if (s && ZE.actionsLeft(s) > 0 && !confirmBox(`행동이 ${ZE.actionsLeft(s)}번 남았어요. 턴을 끝낼까요?`)) return;
      ui.mode = 'move'; ui.sel = null; act('end'); break;
    }
    case 'skill': act('skill', { sid: D.sid, i: +D.i }); break;
    case 'reroll': act('reroll', { src: D.src }); break;
    case 'accept': act('accept'); break;
    case 'pend': case 'slot': {
      if (D.ro) return;
      const ref = A === 'pend' ? { sid: D.sid, pend: +D.i } : { sid: D.sid, slot: +D.i };
      const sel = ui.sel;
      if (sel && sel.sid === ref.sid && sel.slot === ref.slot && sel.pend === ref.pend) { ui.sel = null; render(); return; }
      if (sel && ref.slot != null) { act('swap', { from: sel, to: ref }); ui.sel = null; return; }
      const s = S.survivors.find(x => x.id === ref.sid);
      const c = ref.pend != null ? s.pending[ref.pend] : s.inv[ref.slot];
      if (!c) return;
      ui.sel = ref; render(); break;
    }
    case 'desel': ui.sel = null; render(); break;
    case 'discard': { const sel = ui.sel; if (!sel) return; act('discard', sel); ui.sel = null; break; }
  }
});
// confirm()은 일부 인앱 브라우저에서 막힐 수 있어 간단 대체
function confirmBox(msg) { try { return window.confirm(msg); } catch (e) { return true; } }
function copy(txt) {
  try { navigator.clipboard.writeText(txt).then(() => toast('링크를 복사했어요. 카톡에 붙여넣기 하세요!'), () => fallbackCopy(txt)); } catch (e) { fallbackCopy(txt); }
}
function fallbackCopy(txt) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('링크를 복사했어요!'); } catch (e) { toast('복사 실패 — 링크를 길게 눌러 복사하세요', true); } ta.remove(); }
function share() {
  const url = inviteUrl();
  const text = `🧟 좀비 서바이벌 같이 하자! 방 코드 ${Net.code}`;
  if (CFG.kakaoKey && window.Kakao) {
    try {
      if (!Kakao.isInitialized()) Kakao.init(CFG.kakaoKey);
      Kakao.Share.sendDefault({ objectType: 'text', text, link: { mobileWebUrl: url, webUrl: url }, buttonTitle: '참가하기' });
      return;
    } catch (e) {}
  }
  if (navigator.share) navigator.share({ title: '좀비 서바이벌', text, url }).catch(() => {});
  else copy(url);
}

/* ---------- AI 동료 (방장 폰에서 실행) ---------- */
let aiT = null, aiFail = 0;
const aiFor = {}; // 오프라인 플레이어 대신 AI
function aiPids() { return ['ai'].concat(Object.keys(aiFor).filter(p => aiFor[p] && !pl(p).on)); }
function aiTick() {
  if (Net.role !== 'host' || !S || S.phase !== 'players' || !window.ZAI) return;
  clearTimeout(aiT);
  for (const pid of aiPids()) {
    const n = ZAI.next(S, pid); if (!n) continue;
    const delay = n[0] === 'accept' || n[0] === 'reroll' ? 1100 : n[0] === 'attack' ? 800 : n[0] === 'select' ? 500 : n[0] === 'swap' || n[0] === 'discard' ? 350 : 650;
    aiT = setTimeout(() => {
      const n2 = ZAI.next(Net.state, pid); if (!n2) return;
      const r = Net.actAs(pid, n2[0], n2[1]);
      if (r && r.err) { if (++aiFail > 3) { aiFail = 0; Net.actAs(pid, 'end', {}); } else setTimeout(aiTick, 300); }
      else aiFail = 0;
    }, delay);
    return;
  }
}

/* ---------- 네트워크 이벤트 ---------- */
Net.on('state', st => {
  const prev = S; S = st;
  soundsFor(st);
  BGM.mood(st.phase === 'zombies' || (st.zombies && st.zombies.length > 12));
  if (S.phase !== 'lobby' && ui.zoomFor !== S.mission) { autoZoom(); setTimeout(() => S.active && centerOn(ZE.survAt ? (S.survivors.find(x => x.id === S.active) || {}).cell : 0), 50); }
  if (prev && S.active && prev.active !== S.active) { const a = S.survivors.find(x => x.id === S.active); if (a) setTimeout(() => centerOn(a.cell), 30); }
  if (prev && S.phase === 'players' && prev.phase === 'zombies') SND.play('bell', .35);
  const newRound = prev && prev.round && S.round > prev.round && S.phase !== 'over';
  if (newRound) setTimeout(() => showBanner('🧟 좀비가 몰려왔어요!', 'z'), 0);
  if (prev && S.phase === 'over' && prev.phase !== 'over') setTimeout(() => showBanner(S.result.win ? '🏆 승리!' : '☠️ 패배…', S.result.win ? 'w' : 'z'), 0);
  if (S.lastRoll && S.lastRoll.t !== lastRollT) { if (lastRollT) { rollAnim = true; setTimeout(() => { rollAnim = false; render(); }, 2600); } lastRollT = S.lastRoll.t; }
  if (prev && S.phase === 'players' && prev.active !== S.active) { ui.sel = null; ui.mode = 'move'; }
  if (prev && prev.phase !== S.phase) ui.view = 'act';
  // 내 차례 알림 (진동)
  if (prev && S.phase === 'players' && ZE.curPlayer(S) === me.pid && (prev.phase !== 'players' || ZE.curPlayer(prev) !== me.pid)) { setTimeout(() => showBanner('🔔 내 차례!', 'm'), newRound ? 1900 : 0); try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} }
  render();
  aiTick();
});
Net.on('status', (s, d) => { netStatus = s; if (s === 'idtaken') toast('방 코드가 이미 쓰이고 있어요. 새 방을 만들어주세요.', true); if (s === 'rejected') toast(d || '입장할 수 없어요', true); if (s === 'error') toast('연결 오류: ' + d, true); render(); if (!S) renderHome(); });
Net.on('err', m => toast(m, true));
window.addEventListener('resize', () => { if (S && S.phase !== 'lobby') render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeLock(); });
render();
// 초대 링크로 들어왔고 이름이 저장돼 있으면 빠르게 참가 버튼만 누르면 됨
})();
</script>
<script>
if (window.ZCONFIG.kakaoKey) { var k = document.createElement('script'); k.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js'; document.head.appendChild(k); }
</script>
