 wide:(x,y,C,R,P)=>{if(x==0||x==C-1)return'w';if(y==R-1)return Math.abs(x-(C-1)/2)<P.gw/2+.01?'g':'w';return y<Math.ceil(R*.45)?'C':'i'},
 funnel:(x,y,C,R,P)=>{const d=Math.abs(x-(C-1)/2),e=P.gw/2+(R-1-y)*.8;if(d<e-.99)return y<R*.42?'C':y==R-1?'g':'i';if(d<e+.01)return y==R-1&&d<P.gw/2+.01?'g':'w';return y>R*.5?'n':'.'},
 tunnel:(x,y,C,R,P)=>{const T=P.tn,inT=T.some(t=>x>=t&&x<t+P.gw),nearT=T.some(t=>x==t-1||x==t+P.gw);
  if(y<2)return'C';if(inT)return y==R-1?'g':'i';return nearT?'w':'n'},
 pockets:(x,y,C,R,P)=>{const ox=Math.floor((C-P.rc*5)/2),rx=x-ox,k=Math.floor(rx/5),lx=rx-k*5,ry=y%5,layer=Math.floor(y/5);
  if(rx<0||k>=P.rc||layer>=P.rl||ry==4)return(rx<0||k>=P.rc)&&ry<4?'n':'.';
  if(lx==0||lx==4)return P.side&&ry==2&&(k+layer)%2?'g':'w';if(ry==3)return!P.side&&lx==2?'g':'w';return ry==0?'C':'i'},
 hall:(x,y,C,R,P)=>{const a=Math.floor(R*.4),h=P.gw>1?2:1,sx=P.left?0:C-1;
  if(y<a)return y<2?'C':'n';if(y<a+h)return'i';return x==sx||(P.gw>1&&x==sx+(P.left?1:-1))?(y==R-1?'g':'i'):'w'}};
const tplOf=n=>n<=3?['wide','funnel','tunnel'][n-1]:['funnel','tunnel','pockets','hall','wide'][(n-4)%5];
const COLT=['Grey','Blue','Green','Yellow','Red'],TB=[1,2,3,4.5,6],MAXB=60,DL=PY-7-2,FLOOR=PY+10,BR=4,PTOP=PY-7,PH=16,LY=PTOP-BR-2,SPC=['lh','lv','x','b'];
function genStage(n){
 const r=rng(n*7919+13),t=(n-1)/39,tp='chambers';
 const C=n<=10?10:11,gp=2,bw=Math.floor((W-12-(C-1)*gp)/C),bh=16,ox=(W-(C*bw+(C-1)*gp))/2,step=bh+gp,oy=TOPW+40;   // 블럭은 촘촘히 붙임 → 공은 '입구'로만 들어감
 const R=Math.min(8+Math.floor(n/4),15);
 // 난이도: 입구 폭 3→2→1칸 · 방 수 2→4 · 방 크기 점점 작게 · 줄 수 증가
 const sw=n<=18?2:1,nCav=Math.min(6,2+Math.floor(n/7)),mt=Math.min(3,1+Math.floor(n/10));
 const g=[...Array(R)].map(()=>Array(C).fill('n')),used=[...Array(R)].map(()=>Array(C).fill(0)),cav=[];
 for(let att=0;att<30&&cav.length<Math.min(nCav,2+Math.floor(n/12));att++){if(att){cav.length=0;g.forEach(q=>q.fill('n'));used.forEach(q=>q.fill(0))}
 for(let tries=0;tries<600&&cav.length<nCav;tries++){const sm=tries>200;   // 방끼리는 1칸 벽으로 분리, 입구 통로는 다른 방과 이어져도 OK(연결된 방 = 더 많이 튕김)
  const w=Math.max(sw+2,(sm?3:n<=12?4:3)+(sm?0:r()<.5)),h=(sm?2:n<=12?3:2)+(sm?0:r()<.5),fb=tries>500&&cav.length,x0=fb?(cav[0].x0+cav[0].w/2<C/2?C-w:0):Math.floor(r()*(C-w+1)),y0=fb?1+Math.floor(r()*Math.max(1,R-h-2)):r()<.12?0:1+Math.floor(r()*Math.max(1,R-h-2));
  if(y0+h>R-2)continue;const sx=Math.min(C-sw,Math.max(0,x0+Math.floor((w-sw)/2)+(r()<.5?-1:1)*(w>sw+1&&r()<.5?1:0)));
  let ok=1;for(let y=Math.max(0,y0-1);y<=Math.min(R-1,y0+h)&&ok;y++)for(let x=Math.max(0,x0-1);x<=Math.min(C-1,x0+w);x++)if(used[y][x]){ok=0;break}
  let ye=R;const rm=(y,x)=>x>=0&&x<C&&y<R&&used[y][x]==3;for(let y=y0+h;y<R&&ok;y++){let hit=0;for(let x=sx;x<sx+sw;x++)if(rm(y,x))hit=1;if(hit){ye=y;break}
   for(let x=sx-1;x<=sx+sw;x++)if(x>=0&&x<C&&used[y][x]&&!(used[y][x]==2&&rm(y+1,x))){ok=0;break}}   // 입구는 바닥까지 뚫리거나, 아래 방 천장으로 연결(방-방 연결)
  if(!ok)continue;
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){g[y][x]='i';used[y][x]=3}   // 안쪽 빈 방(공이 갇혀 튕기는 곳)
  for(let y=y0+h;y<ye;y++)for(let x=sx;x<sx+sw;x++){g[y][x]=y==R-1?'g':'i';used[y][x]=1}   // 아래로 뚫린 좁은 입구
  for(let y=Math.max(0,y0-1);y<=Math.min(R-1,y0+h);y++)for(let x=Math.max(0,x0-1);x<=Math.min(C-1,x0+w);x++)used[y][x]=used[y][x]||2;
  for(let y=y0+h;y<ye;y++)for(let x=sx-1;x<=sx+sw;x++)if(x>=0&&x<C)used[y][x]=used[y][x]||2;
  cav.push({x0,y0,w,h})}
 }
 const lining=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const v=(g[y+dy]||[])[x+dx];return v=='i'});
 const lo=50+Math.min(30,n*.75),hi=Math.min(100,62+n*1.2),hpOf=k=>Math.min(100,Math.round(lo+(hi-lo)*k/Math.max(1,mt)+r()*4)),sc=8+n*.3;
 const blocks=[],empty=[],gaps=[];
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){
  const cell=g[y][x],bx=ox+x*(bw+gp),by=oy+y*step;
  if(cell!='n'){empty.push({gx:x,gy:y,x:bx+bw/2,y:by+bh/2,in:true});if(cell=='g')gaps.push({gx:x,gy:y});continue}
  const lin=lining(x,y),q=r();let ty='n',tr=lin?Math.min(mt,1+(r()<.5)):(r()<.6?0:Math.min(1,mt));
  if(lin&&q<.1)ty=SPC[Math.floor(r()*4)];else if(lin&&q<.16)ty='k';else if(!lin&&q<.04&&n>=4)ty='c';
  if(SPC.includes(ty)||ty=='c')tr=Math.min(tr,2);
  blocks.push({x:bx,y:by,y0:by,w:bw,h:bh,t:ty,hp:hpOf(tr),mh:0,c:COLT[tr],fl:0,hl:0,jt:0,gx:x,gy:y,cr:0,key:0});
 }
 blocks.forEach(b=>b.mh=b.hp);
 const inner=empty.filter(e=>!gaps.some(q=>q.gx==e.gx&&q.gy==e.gy)),marks=[];   // +5 마커는 방 안쪽에 → 들어가고 싶게
 for(let k=0;k<Math.min(cav.length,1+Math.floor(n/8))&&inner.length;k++){const s=inner.splice(Math.floor(r()*inner.length),1)[0];marks.push({...s,k:'ball',cd:0})}
 const B=blocks.length,HP=blocks.reduce((s,b)=>s+b.hp,0);
 return{blocks,marks,gaps,B,W2:0,wave2:null,sc,geo:{ox,cw:bw+gp,step,oy,bw,bh},pal:COLT.slice(0,mt+1),tp,spd:7.5,pw:84-t*16,joker:n>=8?.06:0,nb:20,
  dsec:Math.max(11,(32-n*.45)*.8),rf:.25+n*.01,target:Math.round((HP*.6+B*20)/50)*50};
}

/* ---------- 게임 상태 / 런 업그레이드 / 풀링 ---------- */
let G=null,last=0,tx=W/2,keys={},shake=0,uiT=0,U={};
const UPG=['balls','paddle','time','gauge','drop','combo','fever','chain','joker'],UMAX={balls:3,paddle:3,time:3,gauge:2,drop:2,combo:2,fever:2,chain:2,joker:1},u=k=>U[k]||0,resetRun=()=>{U={}};
const POOL=[],PPOOL=[],ST={},RB={x:W-20,y:PY-34};
const FREE=1e9; /* 카톡 공유판: 전체 스테이지 무료 */let payN=0;
function startStage(n){
 if(n>FREE&&!S.paid){if(G)G.state='pause';return unlockModal(n)}

 clearTimeout(uiT);if(G){POOL.push(...G.parts);PPOOL.push(...G.pops)}
 const st=genStage(n);
 G={n,st,blocks:st.blocks,marks:st.marks,left:st.B,balls:[],pieces:[],parts:[],pops:[],dots:[],fx:[],texts:[],q:[],inv:[],score:0,lives:2,
  combo:0,comboT:0,gauge:0,fever:0,feverT:0,ef:{wide:0,power:0,magnet:0,slow:0},px:W/2,ppx:W/2,trs:[],dying:[],lx:W/2,landX:null,state:'play',time:0,clearT:-1,hurt:0,
  nb:Math.min(MAXB,st.nb+5*u('balls')),aim:0,aiming:true,queue:0,fireT:0,tt:0,recall:0,turn:0,drop:0,off:0,cells:null,dirty:1,tick:0,
  chainN:0,chainT:0,chainBest:0,w2done:!st.wave2,w2at:Math.floor(st.B*.35),danger:false,rescued:false,bestOld:S.best[n]||0};
 {const c=st.blocks.filter(b=>b.t!='s'&&!SPC.includes(b.t)&&b.t!='c'&&b.t!='k').sort(()=>Math.random()-.5);c.slice(0,15).forEach(b=>{b.bp=1;b.hp=b.mh=Math.min(b.hp,50+Math.floor(Math.random()*16))})}
 for(let i=0;i<Math.min(2,u('joker'));i++)G.inv.push({c:'J',x:SX+i*(SS+SG),y:SY,s:1});

}
const pw=()=>G.st.pw*(1+.1*u('paddle'))*(G.ef.wide>0?1.5:1);
const boost=()=>1;   // 가속 없음: 공 속도 항상 일정
const dsec=()=>Math.max(5,S.ds*(1-.5*(G.n-1)/39));   // 설정값 기준, 스테이지가 오를수록 점점 빨라짐 (40스테이지 = 설정값의 절반)
const curSpd=()=>G.st.spd*S.spd;   // 모든 스테이지 동일 속도(하단 SPEED 설정만 반영)
const power=()=>1;   // 공 한 번 충돌 = 체력 1 감소
const gGain=v=>{G.gauge=Math.min(100,G.gauge+v*(1+.25*u('gauge')))};
const later=(t,f)=>G.q.push({t,f});
const doShake=v=>{if(S.shake)shake=Math.max(shake,v)};
const sfx=(k,...a)=>SFX[k](...a);   // 중복 제한은 canPlay(오디오 시계)에서 처리 → 2스테이지부터 무음 버그 해결
const addBalls=n=>{const a=Math.min(n,MAXB-G.nb);if(a<=0)return 0;G.nb+=a;const T=G.trs.find(t=>t.end<0&&!t.cl);if(T)for(let i=0;i<a;i++)T.bs.push(nb0());return a};   // 대열 꼬리에 합류
const origin=()=>({x:G.lx,y:LY});   // 조준·예상궤도·실제 발사 공통 기준점
/* ---------- 일렬 대열: 리더만 물리 계산, 팔로워는 리더 꺾임점(pts)을 GAP 간격으로 그대로 통과 ---------- */
const GAP=10,nb0=()=>({k:0,x:0,y:0,on:0,done:0});
function launch(){if(!G.aiming)return;G.aiming=false;G.tt=0;G.recall=0;G.landX=null;const O=G.o=origin(),a=G.aim;
 G.trs=[{pts:[{x:O.x,y:O.y,d:0,ev:0}],D:0,end:-1,L:{x:O.x,y:O.y,vx:Math.sin(a),vy:-Math.cos(a)},bs:Array.from({length:G.nb},nb0)}]}

function txt(x,y,t,c='#fff',sz=16){while(G.texts.some(o=>o.l>.5&&Math.abs(o.y-y)<sz+2))y-=sz+4;G.texts.push({x,y,t,c,sz,l:1})}
function burst(x,y,c,n=8,sp=false,v0=3){for(let i=0;i<n&&G.parts.length<600;i++){const p=POOL.pop()||{},a=Math.random()*6.28,v=1+Math.random()*v0;
 p.x=x;p.y=y;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v-1;p.l=1;p.c=c;p.s=sp?5+Math.random()*3:2+Math.random()*3;p.sp=sp;G.parts.push(p)}}
function pop(x,y,s=14,label='',c='#ff9d2e'){if(G.pops.length>80)return;const p=PPOOL.pop()||{};p.x=x;p.y=y;p.s=s;p.l=1;p.t=label;p.c=c;G.pops.push(p)}

const live=()=>G.blocks.filter(b=>!b.dead);

const ctr=b=>[b.x+b.w/2,b.y+b.h/2];

function dmgBlock(b,d,hl){

 if(b.t=='s'){b.fl=1;sfx('steel');return}
 const dd=Math.min(d,b.hp);b.hp-=d;G.score+=dd*(G.feverT>0?2:1);gGain(.04*dd);b.fl=1;b.jt=1;if(hl)b.hl=1;

/* ---------- 3매치: 리스크 & 보상 ---------- */
function findMatch(inv){const cnt={};let j=0;inv.forEach(i=>i.c=='J'?j++:cnt[i.c]=(cnt[i.c]||0)+1);
 let best=null,bc=0;for(const c in cnt){if(cnt[c]>=3)return c;if(cnt[c]>bc){bc=cnt[c];best=c}}
 return best&&bc+j>=3?best:j>=3?'J':null}
function catchPiece(p){
 if(p.it)return applyItem(p.it,p.x);
 const inv=G.inv;
 if(inv.length>=NS&&!findMatch([...inv,{c:p.c}])){SFX.full();txt(W/2,SY+SS+24,L('full'),'#e5534f',16);G.hurt=1;descend('full');return}   // 5칸 꽉 참 → 블럭 한 칸 하강   // 리스크: 라인 압박
 inv.push({c:p.c,sp:p.sp,x:G.px-SS/2,y:PY,s:.4});SFX.collect();resolve();
}
function resolve(){let c;const inv=G.inv;
 while(c=findMatch(inv)){
  const before=inv.length,same=inv.filter(i=>i.c==c).length,take=c!='J'&&same>=4?same:3,rem=[];
  for(const w of[c,'J'])for(let i=inv.length-1;i>=0&&rem.length<take;i--)if(inv[i].c==w)rem.push(...inv.splice(i,1));
  rem.forEach(it=>pop(it.x+SS/2,it.y+SS/2,16));
  const risky=before>=NS-1,col=c=='J'?pick(G.st.pal):c,f=G.feverT>0;
  G.combo=G.comboT>0?G.combo+1:1;G.comboT=6+2*u('combo');
  const gain=Math.round(100*G.combo*take/3*(f?2:1)*(risky?1.5:1));G.score+=gain;
  gGain(30);if(!f)G.fever=Math.min(100,G.fever+16+G.combo*4);
  txt(W/2,SY+SS+24,'+'+gain,'#f4b92e',16);if(G.combo>1)pop(W/2,SY+SS+44,14+Math.min(G.combo,6)*2,'×'+G.combo,'#e5534f');
  SFX.match();if(G.combo>1)SFX.combo(G.combo);
  if(!lift()){addBalls(5);txt(W/2,PY-70,'+5 ●','#41b66b',15)}   // 3매치 = 모든 블럭 한 칸 위로(이미 맨 위면 공 +10)
  if(take>=4){addBalls(5);txt(W/2,SY-60,'+5 ●','#41b66b',15)}
  rem.map(i=>i.sp).filter(Boolean).forEach(s=>special(s));
 }
 updUI();
}
function special(k){
 const lb=live().filter(b=>b.t!='s');if(!lb.length)return;const low=lb.reduce((a,o)=>o.y>a.y?o:a);SFX.special();
 if(k=='bomb')boom('b',low);else if(k=='line')boom('lh',low);else boom('x',lb.reduce((a,o)=>o.hp>a.hp?o:a));
}
function applyItem(k,x){
 SFX.item();txt(x,PY-40,L('it_'+k),HEX[ITEMS[k][0]]||'#fff',14);
 if(k=='balls'){if(!addBalls(5))G.score+=100}                                                     // 공 줄 +3
 else if(k=='joker'){if(G.inv.length<NS){G.inv.push({c:'J',x:G.px-SS/2,y:PY,s:.4});resolve()}else G.score+=100}
 else if(k=='time')G.dT=Math.max(0,G.dT-10);                                    // 하강 타이머 10초 되돌림
 else if(k=='up'){if(!lift())addBalls(3)}                                        // 블럭 한 칸 위로
 else G.ef[k]=k=='wide'?12:5;                                                    // wide: 패들 12초 확장 · power: 5초 관통
}
function loseLife(){G.lives--;doShake(8);SFX.lose();if(G.lives<=0){G.state='over';clearTimeout(uiT);uiT=setTimeout(failModal,600)}}
function useSkill(k){
 if(!G||G.state!='play'||G.gauge<SKC[k])return;const inv=G.inv;if((k=='purge'||k=='shuffle')&&!inv.length)return;
 G.gauge-=SKC[k];SFX.skill();
 if(k=='blast'){const lb=live().filter(o=>o.t!='s');if(lb.length){const tg=lb.reduce((a,o)=>o.hp>a.hp?o:a);boom('b',tg,1.5+.2*u('power'))}txt(W/2,300,L('blast')+'!','#3d8fe0',18)}
 if(k=='pierce'){G.ef.power=Math.max(G.ef.power,5);txt(W/2,300,L('pierce')+'!','#e5534f',18)}
 if(k=='absorb'){G.pieces=G.pieces.filter(p=>{if(!p.it&&G.inv.length>=NS&&!findMatch([...G.inv,{c:p.c}]))return true;pop(p.x,p.y,10);catchPiece(p);return false});
  G.ef.magnet=Math.max(G.ef.magnet,10);txt(W/2,300,L('absorb')+'!','#41b66b',18)}
 if(k=='purge'){for(let n=0;n<2&&inv.length;n++){const it=inv.pop();pop(it.x+SS/2,it.y+SS/2,14);if(it.c!='J')reinforce(it.c,G.st.sc)}txt(W/2,300,L('purged'),'#f4b92e',16)}
 if(k=='shuffle'){const cnt={};inv.forEach(i=>i.c!='J'&&(cnt[i.c]=(cnt[i.c]||0)+1));const ks=Object.keys(cnt).sort((a,b)=>cnt[a]-cnt[b]||Math.random()-.5);
  const hi=ks[ks.length-1],lo=ks.find(c=>c!=hi)||hi;inv.forEach(i=>{if(i.c==lo){i.c=hi;i.s=.3}});txt(W/2,300,'SHUFFLE!','#8f9aa8',18);resolve()}
 updUI();
}

/* ---------- 업데이트: 전 공 물리 반사 (그리드 브로드페이즈) ---------- */
function collideBox(b,x,y,w,h){   // 원-AABB: 접촉 법선으로 위치 보정 후 Vector reflect, 중심이 안에 박혀도 최단축으로 밀어냄
 const cx=Math.max(x,Math.min(b.x,x+w)),cy=Math.max(y,Math.min(b.y,y+h)),dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;if(d2>=BR*BR)return 0;
 let nx,ny;if(d2>1e-6){const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;b.x=cx+nx*BR;b.y=cy+ny*BR}
 else{const l=b.x-x,r=x+w-b.x,t=b.y-y,u=y+h-b.y,m=Math.min(l,r,t,u);
  if(m==t){nx=0;ny=-1;b.y=y-BR}else if(m==u){nx=0;ny=1;b.y=y+h+BR}else if(m==l){nx=-1;ny=0;b.x=x-BR}else{nx=1;ny=0;b.x=x+w+BR}}
 const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=2*vn*nx;b.vy-=2*vn*ny}return ny<-.5?2:1}
const addPt=(T,ev)=>{T.pts.push({x:T.L.x,y:T.L.y,d:T.D,ev})};
function leaderStep(T,dist,w){const L=T.L,geo=G.st.geo,pwr=power(),n=Math.ceil(dist/(BR*.5)),st=dist/n;let turns=0;
 for(let s=0;s<n&&T.end<0;s++){L.x+=L.vx*st;L.y+=L.vy*st;T.D+=st;let tn=0;
  if(L.y>=FLOOR&&L.vy>0){addPt(T,0);T.end=T.D;if(G.landX==null&&!T.cl)G.landX=L.x;break}
  if(G.lastB&&L.vy<0){const[bx,by]=ctr(G.lastB),c=(bx-L.x)*L.vy-(by-L.y)*L.vx,r=c>0?-.0012:.0012;if(Math.abs(c)>4){const cs=Math.cos(r),sn=Math.sin(r),vx=L.vx*cs-L.vy*sn;L.vy=L.vx*sn+L.vy*cs;L.vx=vx}}
  if(L.x<BR){L.x=BR;L.vx=Math.abs(L.vx);tn=1}else if(L.x>W-BR){L.x=W-BR;L.vx=-Math.abs(L.vx);tn=1}
  if(L.y<TOPW+BR){L.y=TOPW+BR;L.vy=Math.abs(L.vy);tn=1}
  const p0=Math.min(G.ppx,G.px),p1=Math.max(G.ppx,G.px),pc=collideBox(L,p0-w/2,PTOP,p1-p0+w,PH);   // 스윕 히트박스: 고속 패들도 통과 불가
  if(pc==2){let a=Math.max(-1.05,Math.min(1.05,Math.atan2(L.vx,-L.vy)*.5+Math.max(-1,Math.min(1,(L.x-G.px)/(w/2)))*.8+(Math.random()-.5)*.14+(G.time-(G.lh||0)>5?(Math.random()<.5?-.4:.4):0)));const lb=G.lastB;if(lb){const[bx,by]=ctr(lb),ad=Math.atan2(bx-L.x,-(by-L.y));if(Math.abs(ad)<1.2)a=a*.55+ad*.45}L.vx=Math.sin(a);L.vy=-Math.cos(a);sfx('bounce')}
  if(pc)tn=1;
  for(const m of G.marks)if(!m.dead&&Math.abs(L.x-m.x)<BR+8&&Math.abs(L.y-m.y)<BR+8&&G.time-(m.lt??-1)>.2){m.lt=G.time;
   if(m.k=='ball'){m.dead=1;addBalls(5);pop(m.x,m.y,16,'+5','#41b66b');SFX.item()}else if(m.k=='clone'){m.dead=1;cloneTrain(T,m);pop(m.x,m.y,16,'×3','#e5534f');SFX.item()}else{addPt(T,{m});markHit(m)}}
  if(turns<6){const M=cellsMap(),gx=Math.floor((L.x-geo.ox)/geo.cw),gy=Math.floor((L.y-geo.oy-G.off)/geo.step);let hit=0;   // 서브스텝당 1블록, 프레임당 최대 6회 꺾임
   for(let yy=gy-1;yy<=gy+1&&!hit;yy++)for(let xx=gx-1;xx<=gx+1;xx++){const o=M.get((yy+64)*32+xx);if(!o||o.dead)continue;

    if(!collideBox(L,o.x,o.y,o.w,o.h))continue;

 if(T.end<0&&Math.abs(L.vy)<.3){L.vy=(L.vy<0?-1:1)*.3;L.vx=Math.sign(L.vx||1)*Math.sqrt(1-.09);addPt(T,0)}}   // 최소 수직 성분 30% → 좌우 무한 왕복 방지
function trainStep(T,k,w){const dist=curSpd()*k;if(T.end<0)leaderStep(T,dist,w);else T.D+=dist;
 const P=T.pts,pwr=power();let alive=0;

  alive++;if(i==0&&T.end<0){b.x=T.L.x;b.y=T.L.y;b.on=1;b.k=P.length-1;continue}
  if(s<P[0].d){b.on=0;continue}b.on=1;
  while(b.k+1<P.length&&P[b.k+1].d<=s){b.k++;const ev=P[b.k].ev;   // 팔로워는 꺾임점 이벤트를 정확히 1회만 처리
   if(!ev||!i)continue;
   if(ev.b){if(!ev.b.dead){dmgBlock(ev.b,ev.b.t=='s'?0:pwr,1);continue}
    const q=P[b.k],nb=nearBlock(q.x,q.y);if(nb)dmgBlock(nb,pwr,1);continue}   // 대열 분기 없음: 부서진 자리여도 같은 궤도로 꺾이고, 피해는 접점 옆 블록에 전달
   if(ev.m&&G.time-(ev.m.ft??-1)>.1){ev.m.ft=G.time;markHit(ev.m)}}
  const a=P[b.k],c=P[b.k+1]||(T.end<0?{x:T.L.x,y:T.L.y,d:T.D}:a),t=c.d>a.d?(s-a.d)/(c.d-a.d):0;b.x=a.x+(c.x-a.x)*t;b.y=a.y+(c.y-a.y)*t}
 if(P.length>400){const ms=T.D-(T.bs.length-1)*GAP;let cut=0;while(cut+2<P.length&&P[cut+1].d<ms)cut++;if(cut){P.splice(0,cut);T.bs.forEach(b=>b.k=Math.max(0,b.k-cut))}}

function cloneTrain(T,m){const n=Math.min(3,3-G.trs.filter(t=>t.cl&&t.end<0).length),L=T.L,a0=Math.atan2(L.vx,-L.vy),cnt=T.cl?T.bs.length:G.nb;

  G.trs.push({cl:1,pts:[{x:m.x,y:m.y,d:0,ev:0}],D:0,end:-1,L:{x:m.x,y:m.y,vx,vy},bs:Array.from({length:cnt},nb0)})}}

 const c=[];for(let gy=Math.max(0,y0-1);gy<=y1+2;gy++)for(let gx=0;gx*g.cw+g.ox+g.bw<=W;gx++){const x=g.ox+gx*g.cw+g.bw/2,y=g.oy+G.off+gy*g.step+g.bh/2;
  if(y<20||y>PY-70||M.get((gy+64)*32+gx)||G.marks.some(m=>!m.dead&&Math.abs(m.x-x)<20&&Math.abs(m.y-y)<20))continue;c.push({x,y,gx,gy})}
 if(!c.length)return;const s=c[Math.floor(Math.random()*c.length)];G.marks.push({...s,k:'clone',cd:0});pop(s.x,s.y,14,'×3','#e5534f')}
function nearBlock(x,y){const M=cellsMap(),g=G.st.geo,gx=Math.floor((x-g.ox)/g.cw),gy=Math.floor((y-g.oy-G.off)/g.step);let best=null,bd=46*46;
 for(let yy=gy-1;yy<=gy+1;yy++)for(let xx=gx-1;xx<=gx+1;xx++){const o=M.get((yy+64)*32+xx);if(!o||o.dead||o.t=='s')continue;const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h)),d=(x-cx)**2+(y-cy)**2;if(d<bd){bd=d;best=o}}return best}
function split(T,i,k){const P=T.pts,q=P[k],pr=P[k-1]||q,dx=q.x-pr.x,dy=q.y-pr.y,l=Math.hypot(dx,dy)||1,v=l>.01?{x:dx/l,y:dy/l}:{x:T.L.vx,y:T.L.vy};

function update(k){

 G.texts=G.texts.filter(t=>(t.y-=.6*k,t.l-=.015*k)>0);G.dots=G.dots.filter(d=>(d.l-=.04*k)>0);G.fx=G.fx.filter(f=>(f.l-=.045*k)>0);G.dying=G.dying.filter(d=>(d.l-=.08*k)>0);
 if(G.state!='play')return;

 {const q=G.q;G.q=[];const kp=q.filter(e=>(e.t-=dt)>0||(e.f(),false));G.q=kp.concat(G.q)}

 {const lv=G.blocks.filter(b=>!b.dead&&b.t!='s');G.lastB=lv.length==1?lv[0]:null;const B0=G.st.B,th=[.7,.4,.15];if((G.cs||0)<3&&lv.length<=B0*th[G.cs||0]&&lv.length)spawnClone()}

  if(mg&&p.y>200)p.x+=Math.sign(G.px-p.x)*Math.min(Math.abs(G.px-p.x),mg*k);

 const O=origin(),pts=[O.x,O.y],p={x:O.x,y:O.y,vx:Math.sin(G.aim),vy:-Math.cos(G.aim)};let bn=0;   // 실제 공과 동일한 collideBox로 시뮬레이션

 let w='';for(let i=0;i<18;i++){const pp=i==8||i==15;w+=`<i class="${pp?'pp':''}" style="animation-delay:${i*.03}s;${pp?'':`background-image:url(${AU(P+cl[(i*7+i%3)%5]+'/Double/button_rectangle_depth_gloss.png')})`}"></i>`}
 modal(`<div class="bw">${w}</div><h1 class="tlogo">BRICK<b>HARVEST</b></h1><p class="tsub">${L('sub')}</p><div class="tball"></div><div class="tpad"></div>
 ${B(L('newg'),'newg','bG')}<button class="btn bY" data-a="play:${n}" ${has?'':'disabled'}>${L('cont')}${has?' · STAGE '+n:''}</button>${B(L('select'),'select')}${B(L('settings'),'set','bX')}${B(L('howto'),'help:0','bR')}
 <p class="tft">★ ${totStars()} / 120</p>`,titleModal,'ttc')}
function newModal(){if(!(S.un>1||S.last))return newGame();modal(`<h2>${L('newg')}</h2><p><b>${L('newq')}</b></p><p>${L('newq2')}</p><div class="dv"></div>${B(L('yes'),'newok','bR')}${B(L('no'),'title','bX')}`,newModal)}
function newGame(){S.un=1;S.st={};S.best={};S.last=0;save();resetRun();if(S.help)startStage(1);else helpModal(1)}
function helpModal(n){const h=L('h'),ic=['Blue/Double/button_round_depth_gloss.png','Yellow/Double/button_round_depth_gloss.png','Red/Double/button_round_depth_gloss.png','Green/Double/button_square_depth_gloss.png','Yellow/Double/star.png','Grey/Double/button_round_depth_gloss.png','Blue/Double/button_square_depth_gloss.png','Grey/Double/button_square_depth_flat.png','Red/Double/button_square_depth_gloss.png','Yellow/Double/button_square_depth_gloss.png'];
 const items=['balls','clone',...IW.map(([k])=>k)].map(k=>{const[c,g]=ITEMS[k];return`<div><span class="ic" style="background:${c=='J'?'linear-gradient(135deg,#ff6b6b,#ffd23f,#41b66b,#3d8fe0,#c77dff)':HEX[c]}">${g}</span><b>${L('it_'+k)}</b> · ${L('d_'+k)}</div>`}).join('');
 modal(`<h2>${L('howto').toUpperCase()}</h2><div class="help">${h.map((s,i)=>`<h4><img src="${AU(P+ic[i])}" onerror="this.remove()">${s[0]}</h4><ul>${s.slice(1).map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}
 <h4><img src="${AU(P+'Green/Double/button_round_depth_gloss.png')}" onerror="this.remove()">ITEMS</h4><div class="itl">${items}</div></div><div class="dv"></div>
 ${n?B(L('start'),'play:'+n,'bG'):B(L('back'),bk(),'bX')}${langBtn()}`,()=>helpModal(n));S.help=1;save()}
function setModal(){const rg=k=>`<div class="rg"><input type="range" min="0" max="100" value="${Math.round(S[k]*100)}" data-v="${k}"><span>${Math.round(S[k]*100)}%</span></div>`,tg=(k)=>`<div class="seg"><button class="${S[k]?'on':''}" data-a="tog:${k}:1">${L('on')}</button><button class="${S[k]?'':'on'}" data-a="tog:${k}:0">${L('off')}</button></div>`;
 modal(`<h2>${L('settings').toUpperCase()}</h2>
 <div class="set">${L('lang')}<div class="seg"><button class="${S.lang=='ko'?'on':''}" data-a="lg:ko">한국어</button><button class="${S.lang=='en'?'on':''}" data-a="lg:en">English</button></div></div>
 <div class="set">BGM${tg('bgm')}</div><div class="set">${L('vbgm')}${rg('vb')}</div><div class="set">SFX${tg('sfx')}</div><div class="set">${L('vsfx')}${rg('vs')}</div><div class="set">${L('shake')}${tg('shake')}</div>
 <div class="set">${L('dsec')}<div class="seg">${[10,15,20,25].map(v=>`<button class="${v==S.ds?'on':''}" data-a="ds:${v}">${v}s</button>`).join('')}</div></div>
 <div class="set">${L('speed')}<div class="seg">${SPDS.map(v=>`<button class="${v==S.spd?'on':''}" data-a="sp:${v}">${v}×</button>`).join('')}</div></div>
 <div class="dv"></div>${B(L('back'),bk(),'bX')}`,setModal)}
/* ---------- 결제(5스테이지 이후 2,000원 해금) ----------
 원스토어 웹게임 SDK 연결 지점: window.BH_PAY = { buy:()=>Promise<bool>, restore:()=>Promise<bool> }
 SDK를 받으면 아래 BH_PAY만 채우면 됨 (상품 ID: full_unlock, 관리형 상품, 2,000원) */
function unlockModal(n){payN=n;modal(`<h2>${L('unl_t')}</h2><p class="big">₩2,000</p><p><b>${L('unl_1')}</b></p><p>${L('unl_2')}</p><div class="dv"></div>${B(L('unl_buy'),'buy','bG')}${B(L('unl_rs'),'restore','bY')}${B(L('totitle'),'title','bX')}`,()=>unlockModal(n))}
function payMsg(t,ok){modal(`<h2>${L('unl_t')}</h2><p><b>${t}</b></p><div class="dv"></div>${ok?B(L('unl_go'),'paygo','bG'):B(L('back'),'unl2','bX')}`,null)}
async function doPay(k){const P=window.BH_PAY;if(!P||!P[k])return payMsg(L('unl_na'));
 let ok=false;try{ok=await P[k]('full_unlock')}catch(e){ok=false}
 if(ok==='cancel')return unlockModal(payN);
 if(ok===true){S.paid=1;save();SFX.clear();payMsg(L('unl_ok'),1)}else payMsg(L(k=='restore'?'unl_none':'unl_fail'))}
function selectModal(){if(G&&G.state=='play')G.state='pause';let g='';
 for(let i=1;i<=MAXS;i++){if(i%10==1)g+=`<div class="sec">${L('secs')[(i-1)/10|0]} · ${i}–${i+9}</div>`;const lk=i>unlocked(),st=S.st[i]||0;
  g+=`<button class="sb ${lk?'lk':''}" ${lk?'disabled':''} data-a="play:${i}">${lk?'🔒':i}<small>${i>FREE&&!S.paid?'₩':lk?'':'★'.repeat(st)+'☆'.repeat(3-st)}</small></button>`}
 modal(`<h2>STAGES</h2><p class="k">★ ${totStars()} / 120</p><div class="grid">${g}</div>${S.paid?'':B(L('unl_btn'),'unl','bG')}${B(L('back'),bk(),'bX')}`,selectModal);
 }
function pauseModal(){onT=0;G.state='pause';modal(`<h2>${L('pause')}</h2><p>STAGE ${G.n} · ${G.score} / ${G.st.target}</p>${upList()}${B(L('resume'),'resume','bG')}${B(L('retry'),'retry','bY')}${B(L('howto'),'help:0')}${B(L('settings'),'set','bX')}${B(L('select'),'select')}${B(L('totitle'),'title','bX')}${S.dev?B(L('devwin'),'win','bR'):''}`,pauseModal)}
function resume(){closeModal();if(G&&G.state=='pause')G.state='play'}
function record(){const n=G.n,nb=G.score>G.bestOld;if(G.score>(S.best[n]||0))S.best[n]=G.score;save();return nb}
function clearModal(){const n=G.n,t=G.st.target,st=G.score>=t*1.35?3:G.score>=t?2:1;
 S.st[n]=Math.max(S.st[n]||0,st);S.un=Math.max(S.un,Math.min(n+1,MAXS));const nb=record();
 const show=()=>modal(`<h2>${n==MAXS?L('allclear'):L('clear')}</h2>${stars(st)}<p class="big">${G.score}</p>${nb?`<p class="nb">${L('newbest')}</p>`:`<p>${L('best')}: ${S.best[n]}</p>`}
 <p>${L('goal',{a:t,b:Math.round(t*1.35)})}</p><p>${L('t_'+G.st.tp)} · ${L('chainbest')} ×${G.chainBest} · ★ ${totStars()} / 120</p><div class="dv"></div>
 ${upList()}${n<MAXS?B(L('next'),'next:'+(n+1),'bG'):''}${B(L('retry2'),'retry','bY')}${B(L('select'),'select')}`,show);show()}
const upList=()=>{const o=UPG.filter(k=>u(k));return o.length?`<p class="ul">${L('ups')}: ${o.map(k=>L('u_'+k)+' '+u(k)).join(' · ')}</p>`:''};
function upgradeModal(){const opts=UPG.filter(k=>u(k)<UMAX[k]).sort(()=>Math.random()-.5).slice(0,3);if(!opts.length)return clearModal();   // 항목별 최대 레벨 제한
SFX.item();
 const show=()=>modal(`<h2>${L('upg')}</h2><p>${L('upgsub')}</p><div class="up">${opts.map((k,i)=>B(`${L('u_'+k)} <i>${u(k)+1}/${UMAX[k]}</i><small>${L('ud_'+k)}</small>`,'up:'+k,['','bG','bY'][i])).join('')}</div>`,show);show()}
function failModal(){record();S.un=1;S.st={};S.best={};S.last=0;save();resetRun();const show=()=>modal(`<h2>${L('over')}</h2><p class="big">${G.score}</p><p>STAGE ${G.n}</p><p><b>${L('reset1')}</b></p><p>${L('reset2')}</p><div class="dv"></div>${B(L('restart1'),'newok','bR')}${B(L('totitle'),'title','bX')}`,show);show()}
M.addEventListener('input',e=>{const k=e.target.dataset.v;if(!k)return;S[k]=e.target.value/100;e.target.nextElementSibling.textContent=e.target.value+'%';applyVol()});
M.addEventListener('change',e=>{if(e.target.dataset.v){save();if(e.target.dataset.v=='vs')SFX.click()}});
M.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,v,w]=b.dataset.a.split(':');SFX.click();
 if(a=='play'){resetRun();startStage(+v)}else if(a=='unl')unlockModal(0);else if(a=='unl2')unlockModal(payN);else if(a=='buy')doPay('buy');else if(a=='restore')doPay('restore');else if(a=='paygo'){if(payN)startStage(payN);else selectModal()}else if(a=='next')startStage(+v);else if(a=='up'){U[v]=u(v)+1;clearModal()}else if(a=='help')helpModal(+v);else if(a=='retry')startStage(G.n);else if(a=='select')selectModal();
 else if(a=='title')titleModal();else if(a=='newg')newModal();else if(a=='newok')newGame();else if(a=='set')setModal();else if(a=='lang')setLang(S.lang=='ko'?'en':'ko');else if(a=='lg')setLang(v);
 else if(a=='tog'){S[v]=w=='1';save();applyVol();setModal()}else if(a=='sp'){setSpd(+v);setModal()}else if(a=='ds'){S.ds=+v;save();setModal()}
 else if(a=='back'){if(G.state=='clear')clearModal();else if(G.state=='over')failModal();else pauseModal()}
 else if(a=='resume')resume();
 else if(a=='win'){closeModal();G.state='play';G.w2done=true;G.blocks.forEach(b=>killBlock(b,true));G.left=0}});

fit();applyVol();renderSpd();setLang(S.lang);titleModal();refit();requestAnimationFrame(loop);

}
</script></body></html>
